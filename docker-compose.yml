services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkbio
      POSTGRES_PASSWORD: linkbio
      POSTGRES_DB: linkbio
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
